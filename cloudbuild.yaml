substitutions:
  _REGION: us-central1
  _SERVICE_NAME: lta-nebula-x-hackathon
  _RUNTIME_SERVICE_ACCOUNT: lta-nebula@qwiklabs-gcp-02-e3a0cea27f91.iam.gserviceaccount.com

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}
      - .

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --port=8080
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},FIRESTORE_DATABASE_ID=(default),ENVIRONMENT=production,APP_URL=https://${PROJECT_ID}.web.app
      - --update-secrets=LTA_DATAMALL_ACCOUNT_KEY=clearpath-lta-datamall-account-key:latest,ONEMAP_EMAIL=clearpath-onemap-email:latest,ONEMAP_PASSWORD=clearpath-onemap-password:latest,ONEMAP_API_TOKEN=clearpath-onemap-api-token:latest
      - --project=${PROJECT_ID}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
